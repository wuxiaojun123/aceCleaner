<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AceClean · Lottie 动画</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="prototype.css"><style>body{background:var(--page)}.library{max-width:1100px;margin:auto;padding:40px 26px}.library header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:35px}.library h1{font-size:25px;letter-spacing:-1px}.library header p{font-size:12px;color:var(--muted);margin-top:9px}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.motion-card{background:white;border:1px solid var(--line);border-radius:22px;padding:20px}.motion-card .motion{margin:auto;width:220px;height:220px}.motion-card h2{font-size:16px;margin:14px 0 7px}.motion-card p{font-size:12px;color:var(--muted);line-height:1.7}.motion-card a{display:inline-block;font-size:12px;color:#b84316;margin-top:13px;min-height:32px}.library-controls{display:flex;gap:18px;align-items:center;margin-bottom:20px;font-size:12px}.library-controls button{min-height:44px;background:var(--pale);padding:8px 16px;border-radius:12px}</style></head>
<body><div id="root"></div><script src="vendor/react.js"></script><script src="vendor/react-dom.js"></script><script src="vendor/babel.js"></script><script src="vendor/canvaskit.js"></script><script type="text/babel" src="components.jsx?v=vacuum-2"></script><script type="text/babel">
function Library(){const [playing,setPlaying]=React.useState(true);const [cycle,setCycle]=React.useState(0);const scenes=[['robot-cleaning-orange','橙色机器人清理','根据录屏 GIF 重绘，吸尘器持续吸入彩色垃圾，碎屑沿弧线加速缩小，4 秒无缝循环。'],['device-scan','设备扫描','手机轮廓内往返扫描，循环 3 秒。'],['junk-scan','垃圾扫描','分层文件配合扫描线，循环 3 秒。'],['junk-clean','垃圾清理','小幅扫动和碎屑收拢，循环 3 秒。'],['battery-scan','电池读取','电量从一格逐步充满，满格停留后循环，3 秒。'],['battery-check','电池检查','电量从一格逐步充满，满格显示对勾后循环，3 秒。'],['complete','完成反馈','橙色圆形轻微落定，对勾绘制后停留。']];return <main className="library"><header><div><h1>新手流程 · Lottie 动画</h1><p>透明背景 / 320–480 × 320–480 / 30 fps / Shape-only JSON</p></div><a href="index.html">返回交互原型 ↗</a></header><div className="library-controls"><button onClick={()=>setPlaying(!playing)}>{playing?'暂停动画':'播放动画'}</button><button onClick={()=>{setCycle(cycle+1);setPlaying(true)}}>重新播放</button><span>主色 #FF6B2C</span></div><div className="library-grid">{scenes.map(([name,title,desc],i)=><article className="motion-card" key={name+'-'+cycle}><Motion name={name} playing={playing} loop={name!=='complete'}/><h2>{title}</h2><p>{desc}</p><a href={'animations/'+name+'.json'} download>下载 Lottie JSON ↓</a></article>)}</div></main>};ReactDOM.createRoot(document.getElementById('root')).render(<Library/>);
</script></body></html>
